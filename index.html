<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DC&amp;M</title>
    <meta name="description" content="한성대학교 동아리 DC&M — 코딩테스트 스터디, 독서클럽, 해커톤" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236c69ff'/%3E%3Cstop offset='1' stop-color='%23c3c1ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url%28%23g%29'/%3E%3Cg transform='translate%289 9%29 scale%280.96%29'%3E%3Crect x='6' y='6' width='6.5' height='36' rx='3.25' fill='%23fff'/%3E%3Cpath d='M19 9.5 33.5 24 19 38.5' stroke='%23fff' stroke-width='6.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Crect x='34' y='38.5' width='10' height='4.5' rx='1.5' fill='%23fbd3f3'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e1c" media="(prefers-color-scheme: dark)" />
    <!-- 테마: 화면을 그리기 전에 정해서 흰 화면이 번쩍이지 않게 합니다. 고른 값(dcm-theme)이 없으면 기기 설정을 따릅니다. (src/lib/theme.js) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("dcm-theme");
          if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" />
    <!-- 첫 방문 인트로: 페이지가 그려지기 전에 화면을 인트로 배경으로 가려서 메인이 잠깐 보였다 사라지지 않게 합니다.
         개발 모드에서는 CSS가 JS로 늦게 붙기 때문에 파일 CSS가 아니라 여기에 인라인으로 둡니다.
         조건은 src/intro/Intro.tsx와 같고, 홈 경로('#/' 또는 해시 없음)일 때만 가립니다.
         Intro가 뜨면 걷고, 끝내 못 뜨면 6초 뒤 스스로 걷힙니다. -->
    <style>
      html.dcm-intro-pending { overflow: hidden; }
      html.dcm-intro-pending body::after {
        content: ""; position: fixed; inset: 0; z-index: 999;
        background: radial-gradient(75% 75% at 50% 50%, #24245a 0%, #14142e 52%, #0b0b1a 100%);
        animation: dcm-intro-pending-out 0.4s ease 6s forwards;
      }
      @keyframes dcm-intro-pending-out { to { opacity: 0; visibility: hidden; } }
    </style>
    <script>
      (function () {
        try {
          var h = location.hash;
          if (h && h !== "#" && h !== "#/") return;
          var force = new URLSearchParams(location.search).has("intro");
          if (force || (!localStorage.getItem("dcm-intro-seen")))
            document.documentElement.classList.add("dcm-intro-pending");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
